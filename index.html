<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FADECLUB — Support</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #515050;
        font-family: Georgia, "Times New Roman", Times, serif;
      }

      .chat-container {
        width: 420px;
        background: #111116;
        border: 1px solid #6e6e6e;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        color: #eaeaea;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #eed8ae;
        letter-spacing: 2px;
        font-size: 18px;
      }

      #chat-box {
        border: 1px solid #2e2e3a;
        border-radius: 10px;
        height: 320px;
        overflow-y: auto;
        padding: 12px;
        margin-bottom: 16px;
        background: #0d0d12;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #chat-box::-webkit-scrollbar {
        width: 5px;
      }

      #chat-box::-webkit-scrollbar-track {
        background: #1a1a22;
      }

      #chat-box::-webkit-scrollbar-thumb {
        background: #3a3a4a;
        border-radius: 4px;
      }

      .message {
        padding: 10px 14px;
        border-radius: 10px;
        max-width: 78%;
        font-size: 14px;
        line-height: 1.5;
      }

      .user {
        background: #373a48;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
      }

      .bot {
        background: #222230;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
      }

      .input-area {
        display: flex;
        gap: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #2e2e3a;
        border-radius: 8px;
        background: #0d0d12;
        color: #f5f5f5;
        font-family: Georgia, "Times New Roman", Times, serif;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      input[type="text"]:focus {
        border-color: #eed8ae55;
      }

      button {
        padding: 10px 18px;
        border: 1px solid #5a4343;
        background: #1a1a22;
        color: #eed8ae;
        border-radius: 8px;
        cursor: pointer;
        font-family: Georgia, "Times New Roman", Times, serif;
        font-size: 14px;
        transition: background 0.2s;
      }

      button:hover {
        background: #242430;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <h2>FADECLUB</h2>

      <div id="chat-box"></div>

      <div class="input-area">
        <input
          type="text"
          id="message"
          placeholder="Ask us anything..."
          onkeydown="handleKey(event)"
          autocomplete="off"
        />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      function handleKey(event) {
        if (event.key === "Enter") sendMessage();
      }

      async function sendMessage() {
        const input = document.getElementById("message");
        const chatBox = document.getElementById("chat-box");
        const message = input.value.trim();

        if (!message) return;

        appendMessage(chatBox, message, "user");
        input.value = "";

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });

          const data = await res.json();
          appendMessage(chatBox, data.reply, "bot");
        } catch {
          appendMessage(chatBox, "Something went wrong. Please try again.", "bot");
        }
      }

      function appendMessage(chatBox, text, sender) {
        const div = document.createElement("div");
        div.className = `message ${sender}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    </script>
  </body>
</html>
